name: Build Android Multi-Tool Windows EXE + Setup

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: write-all

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Official Windows Platform Tools (adb & fastboot)
        run: |
          python download_windows_binaries.py

      - name: Compile Standalone Executable via PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm AndroidMultiTool.spec

      - name: Verify Executable Created
        run: |
          if (Test-Path "dist\AndroidMultiTool.exe") {
            Write-Host "SUCCESS: dist\AndroidMultiTool.exe successfully compiled!"
            Get-Item "dist\AndroidMultiTool.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "Build failed: dist\AndroidMultiTool.exe was not found."
            exit 1
          }

      - name: Install Inno Setup 6 (for Setup.exe where it installs)
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup 6 already installed, skipping choco"
          } else {
            choco install innosetup --yes --no-progress --force
            if ($LASTEXITCODE -ne 0) { Write-Host "choco exit $LASTEXITCODE but continuing" }
          }
          Write-Host "Inno Setup 6 ready at C:\Program Files (x86)\Inno Setup 6\ISCC.exe"



      - name: Compile Windows Setup.exe (like Oumse — installs to Program Files)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_setup.iss
          if (Test-Path "dist\installer\AndroidMultiTool_Setup_v2.5.exe") {
            Write-Host "SUCCESS: Setup compiled!"
            Get-Item "dist\installer\AndroidMultiTool_Setup_v2.5.exe" | Select-Object Name, Length, LastWriteTime
            Get-Content "dist\installer\installer_manifest.txt" | Select-Object -First 20
          } else {
            Write-Error "Setup build failed: dist\installer\AndroidMultiTool_Setup_v2.5.exe not found."
            exit 1
          }

      - name: Prepare Release Package (EXE + Driver Tools + Setup)
        run: |
          New-Item -ItemType Directory -Force -Path "dist\package"
          Copy-Item "dist\AndroidMultiTool.exe" -Destination "dist\package\"
          Copy-Item "dist\installer\AndroidMultiTool_Setup_v2.5.exe" -Destination "dist\package\" -ErrorAction SilentlyContinue
          Copy-Item "install_drivers.bat" -Destination "dist\package\"
          Copy-Item "install_app_on_pc.bat" -Destination "dist\package\"
          Copy-Item "build_installer.bat" -Destination "dist\package\"
          Copy-Item "README.md" -Destination "dist\package\"
          Copy-Item "assets\icon.ico" -Destination "dist\package\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\package\*" -DestinationPath "dist\AndroidMultiTool-v2.5-Windows.zip" -Force
          if (Test-Path "dist\installer\AndroidMultiTool_Setup_v2.5.exe") {
            Copy-Item "dist\installer\AndroidMultiTool_Setup_v2.5.exe" -Destination "dist\AndroidMultiTool_Setup_v2.5.exe" -Force
          }

      - name: Upload Artifact — EXE + ZIP + Setup
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AndroidMultiTool-Windows-v2.5
          path: |
            dist/AndroidMultiTool.exe
            dist/AndroidMultiTool-v2.5-Windows.zip
            dist/installer/AndroidMultiTool_Setup_v2.5.exe
            dist/AndroidMultiTool_Setup_v2.5.exe
          retention-days: 5
          if-no-files-found: warn
          compression-level: 6

      - name: Create GitHub Release (On Tagged Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AndroidMultiTool.exe
            dist/AndroidMultiTool-v2.5-Windows.zip
            dist/installer/AndroidMultiTool_Setup_v2.5.exe
            dist/AndroidMultiTool_Setup_v2.5.exe
          draft: false
          prerelease: false
          generate_release_notes: true
